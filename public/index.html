<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button class="theme-toggle" id="theme-toggle" title="Toggle dark mode">🌙</button>
  <div class="container">
    <h1>Dashboard</h1>
    
    <!-- Tab Navigation -->
    <div class="tabs">
      <button class="tab-button active" data-tab="github">GitHub</button>
      <button class="tab-button" data-tab="calendar">Calendar</button>
    </div>

    <!-- GitHub Tab -->
    <div id="github-tab" class="tab-content active">
      <p>Choose a field and a value, then submit to update <code>input.json</code> and create a PR.</p>

      <div class="panel">
        <form id="dashboard-form">
          <label for="field-select">Field</label>
          <select id="field-select"></select>

          <label for="value-select">Value</label>
          <select id="value-select"></select>

          <button type="submit">Submit</button>
        </form>
      </div>

      <div class="panel status" id="status-panel">
        <h2>Status</h2>
        <div id="status-message">Loading...</div>
      </div>

      <div class="input-comparison">
        <div class="panel">
          <h2>Current change</h2>
          <pre id="input-json">{ }</pre>
        </div>

        <div class="panel">
          <h2>Current file</h2>
          <pre id="input-json-main">{ }</pre>
        </div>
      </div>
    </div>

    <!-- Calendar Tab -->
    <div id="calendar-tab" class="tab-content">
      <div class="calendar-container">
        <div class="calendar-header">
          <button id="prev-month">&lt;</button>
          <h2 id="calendar-month">January 2026</h2>
          <button id="next-month">&gt;</button>
        </div>
        <div id="calendar" class="calendar"></div>
        <p style="text-align: center; margin-top: 16px; font-size: 0.9rem; color: var(--text-secondary); opacity: 0.8;">
          💡 Click on two dates to set the event range (start and end date)
        </p>
      </div>
      
      <div class="panel">
        <h2>Events & Holidays</h2>
        <div id="events-list"></div>
        <form id="event-form" style="margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border-color);">
          <label for="event-start-date">Start Date</label>
          <input type="date" id="event-start-date" required />
          
          <label for="event-end-date">End Date</label>
          <input type="date" id="event-end-date" required />
          
          <label for="event-name">Event Name</label>
          <input type="text" id="event-name" required />
          
          <label for="event-type">Type</label>
          <select id="event-type">
            <option value="event">Event</option>
            <option value="holiday">Holiday</option>
          </select>
          
          <button type="submit">Add Event</button>
        </form>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
